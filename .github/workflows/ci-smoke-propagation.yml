name: CI - Smoke propagation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-propagation:
    runs-on: ubuntu-latest
    env:
      OREKIT_DATA: ${{ github.workspace }}/orekit-data
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java (for Orekit)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest
      - name: Run propagation smoke test
        env:
          PYTHONPATH: ./src
        run: |
          pytest OrbitalAvoidance/tests/test_debris_dynamics.py -q
